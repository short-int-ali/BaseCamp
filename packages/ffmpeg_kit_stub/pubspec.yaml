name: ffmpeg_kit_flutter_new_min
version: 0.0.1
description: >
  No-op stub replacing the real ffmpeg_kit_flutter_new_min to avoid a native
  JNI crash (Bad JNI version from libffmpegkit_abidetect.so) on release builds.
  whisper_ggml uses FFmpegKit only for audio resampling; Base Camp already
  records 16 kHz mono WAV so the conversion is unnecessary.

environment:
  sdk: ">=3.1.0 <4.0.0"
