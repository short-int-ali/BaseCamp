name: base_camp
description: "Base Camp — Localized, multimodal emergency safety system. 100% offline, on-device Gemma 4 E2B via LiteRT-LM."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Local-only inference stack. Any addition of http clients (http, dio,
# google_generative_ai, etc.) violates the offline safety constraint and
# must be rejected in review.
dependencies:
  flutter:
    sdk: flutter

  # On-device LLM runtime. Primary engine for Gemma 4 E2B multimodal
  # inference (CPU / GPU / NPU on Android, CPU on iOS). E2B was chosen
  # over E4B for the ~40% smaller resident set on 6–8 GB devices; the
  # plugin/runtime contract is identical between the two variants.
  #
  # Pinned to a local fork of 0.3.0 — upstream has a bug where the Android
  # plugin reads `visionBackend` / `audioBackend` from the method channel
  # but never threads them into `EngineConfig`, causing a native SIGSEGV
  # inside `Java_..._nativeSendMessage` when the first image arrives.
  # The fork at packages/flutter_litert_lm wires both backends through to
  # the upstream Kotlin SDK's `EngineConfig` so multimodal actually works.
  flutter_litert_lm:
    path: packages/flutter_litert_lm

  # Camera capture for the Snap-and-Solve vision module.
  camera: ^0.11.0

  # Resolve on-device paths (application support dir) for model + KB files.
  path_provider: ^2.1.4

  # Runtime permission prompts (camera now, microphone later for the
  # multilingual gateway).
  permission_handler: 12.0.1

  # Pure-Dart image preprocessing (resize / re-encode) before frames are
  # handed to the Gemma vision encoder.
  image: ^4.2.0

  # Offline microphone capture to a WAV file. Feeds the hands-free audio
  # gateway (Gemma 4 E2B audio tower does ASR + understanding in one
  # pass — the audio tower is shared between the E2B and E4B variants,
  # so this contract did not change with the E4B → E2B swap). No network
  # IO.
  record: ^6.1.1

  # Device text-to-speech for spoken ASK replies (out-of-process engine;
  # avoids loading Piper / sherpa TTS weights beside Gemma).
  flutter_tts: ^4.2.0

  # Offline session log export (system share sheet — email, Drive, etc.).
  share_plus: ^10.1.4

  # Session-end TXT → PDF archival (Downloads/Basecamp).
  pdf: ^3.11.3
  crypto: ^3.0.6
  open_filex: ^4.7.0

  # Pattern-based vibration for the agentic CPR / breathing / timer
  # tools. Built-in `HapticFeedback` only exposes coarse impact tiers
  # (`lightImpact`, `mediumImpact`, `heavyImpact`, `selectionClick`);
  # we need waveform control — pulse-width, gap, and amplitude — to
  # render a CPR metronome at 100-120 BPM and to phase-distinguish
  # the breathing pacer's inhale / hold / exhale boundaries.
  #
  # Fully offline (no network IO). On iOS the package degrades to
  # CoreHaptics / 500 ms emulated vibrations; the tool layer detects
  # this via `Vibration.hasVibrator()` and falls back to
  # `HapticFeedback.heavyImpact()` per beat.
  vibration: ^2.0.0

  # Short metronome beeps for the CPR cadence tool (low-latency playback).
  audioplayers: ^6.1.0

  # Hands-free: Whisper GGML STT + sherpa_onnx Silero VAD. Spoken replies
  # use [flutter_tts] (system engine), not Piper.
  whisper_ggml: ^1.7.0
  sherpa_onnx: ^1.12.20

  cupertino_icons: ^1.0.8

# whisper_ggml depends on ffmpeg_kit_flutter_new_min whose native
# libffmpegkit_abidetect.so crashes on release builds (Bad JNI version
# from JNI_OnLoad — sk3llo/ffmpeg_kit_flutter#76). The FFmpeg audio
# conversion is unnecessary because we already record 16 kHz mono WAV.
# A local no-op stub replaces the real plugin so no native code loads.
dependency_overrides:
  ffmpeg_kit_flutter_new_min:
    path: packages/ffmpeg_kit_stub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: BaseCamp_icon.jpeg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/kb/
    - assets/kb/datasets/
    # Offline speech: Whisper GGML + Silero VAD (see assets/*/README.md).
    - assets/whisper/
    - assets/sherpa/
    - assets/sherpa/vad/
